<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bgA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#1a263e"/>
    </linearGradient>
    <linearGradient id="iconA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a1a"/>
      <stop offset="100%" stop-color="#ff9c4d"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bgA)"/>
  <circle cx="200" cy="170" r="120" fill="#ffffff" opacity="0.04"/>

  <!-- blender jug -->
  <path d="M172 92 h56 l-10 96 h-36 z" fill="url(#iconA)"/>
  <rect x="164" y="80" width="72" height="16" rx="4" fill="#ffffff" opacity="0.9"/>
  <rect x="182" y="188" width="36" height="18" rx="3" fill="#0b1220"/>
  <rect x="176" y="206" width="48" height="14" rx="6" fill="url(#iconA)"/>

  <!-- steam / heat lines -->
  <path d="M150 70 q6 -12 0 -22" stroke="#ffffff" stroke-width="5" fill="none" opacity="0.5" stroke-linecap="round"/>
  <path d="M250 70 q6 -12 0 -22" stroke="#ffffff" stroke-width="5" fill="none" opacity="0.5" stroke-linecap="round"/>

  <!-- fridge/oven accent block -->
  <rect x="120" y="230" width="60" height="60" rx="8" fill="#ffffff" opacity="0.08"/>
  <rect x="220" y="230" width="60" height="60" rx="8" fill="#ffffff" opacity="0.08"/>
  <circle cx="150" cy="260" r="4" fill="#ff9c4d"/>
  <circle cx="250" cy="260" r="4" fill="#ff9c4d"/>

  <text x="200" y="330" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">HOME APPLIANCES</text>
  <text x="200" y="356" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#ff9c4d" text-anchor="middle" letter-spacing="1">KITCHEN · COOLING · CLEANING</text>
</svg>
