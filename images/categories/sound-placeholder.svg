<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bgS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#1a263e"/>
    </linearGradient>
    <linearGradient id="iconS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a1a"/>
      <stop offset="100%" stop-color="#ff9c4d"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bgS)"/>
  <circle cx="200" cy="170" r="120" fill="#ffffff" opacity="0.04"/>

  <!-- TV / screen -->
  <rect x="110" y="100" width="180" height="112" rx="10" fill="url(#iconS)"/>
  <rect x="122" y="112" width="156" height="88" rx="4" fill="#0b1220"/>
  <rect x="185" y="212" width="30" height="16" fill="url(#iconS)"/>
  <rect x="160" y="228" width="80" height="8" rx="4" fill="url(#iconS)"/>

  <!-- soundwave bars either side -->
  <rect x="70" y="150" width="10" height="40" rx="4" fill="#ffffff" opacity="0.85"/>
  <rect x="55" y="135" width="10" height="70" rx="4" fill="#ffffff" opacity="0.55"/>
  <rect x="320" y="150" width="10" height="40" rx="4" fill="#ffffff" opacity="0.85"/>
  <rect x="335" y="135" width="10" height="70" rx="4" fill="#ffffff" opacity="0.55"/>

  <!-- woofer circle -->
  <circle cx="200" cy="260" r="4" fill="#ffffff" opacity="0.6"/>

  <text x="200" y="330" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">SOUND SYSTEMS</text>
  <text x="200" y="356" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#ff9c4d" text-anchor="middle" letter-spacing="1">TVs · WOOFERS · SPEAKERS</text>
</svg>
