<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bgTV" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#1a263e"/>
    </linearGradient>
    <linearGradient id="iconTV" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a1a"/>
      <stop offset="100%" stop-color="#ff9c4d"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bgTV)"/>
  <circle cx="200" cy="175" r="130" fill="#ffffff" opacity="0.04"/>

  <!-- Large widescreen TV, front and center -->
  <rect x="80" y="110" width="240" height="140" rx="12" fill="url(#iconTV)"/>
  <rect x="94" y="124" width="212" height="112" rx="5" fill="#0b1220"/>

  <!-- On-screen "play" glyph to read clearly as a screen -->
  <path d="M182 158 l40 22 l-40 22 z" fill="#ff9c4d" opacity="0.85"/>

  <!-- Stand -->
  <rect x="188" y="250" width="24" height="20" fill="url(#iconTV)"/>
  <rect x="150" y="270" width="100" height="10" rx="5" fill="url(#iconTV)"/>

  <!-- Signal / antenna accents -->
  <path d="M130 96 q10 -20 30 -24" stroke="#ffffff" stroke-width="5" fill="none" opacity="0.4" stroke-linecap="round"/>
  <path d="M270 96 q-10 -20 -30 -24" stroke="#ffffff" stroke-width="5" fill="none" opacity="0.4" stroke-linecap="round"/>

  <text x="200" y="330" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">TELEVISIONS</text>
  <text x="200" y="356" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#ff9c4d" text-anchor="middle" letter-spacing="1">DIGITAL · SMART · 4K UHD</text>
</svg>
